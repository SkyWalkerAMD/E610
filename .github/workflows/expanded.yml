name: E610 expanded Linux coverage r3
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated media IDs; empty selects the complete new inventory'
        required: false
        default: ''
      tools_only:
        description: 'Export disposable offline test user spaces for the authorized mirror host'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: e610-coverage-r3-${{ github.ref }}-${{ inputs.tools_only }}
  cancel-in-progress: false
jobs:
  inventory:
    if: ${{ !inputs.tools_only }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: matrix
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          python3 - <<'PY'
          import json, os
          all_targets=json.load(open('coverage/inventory.json'))
          wanted={x.strip() for x in os.environ['TARGETS'].split(',') if x.strip()}
          known={t['id'] for t in all_targets}
          assert wanted <= known, wanted-known
          matrix=[{'id':t['id']} for t in all_targets if not wanted or t['id'] in wanted]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(matrix)+'\n')
          PY
  kernels:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare exact-kernel build and boot tools
        run: bash expanded/setup-runner.sh
      - name: Inspect native support and validate required drivers
        run: python3 coverage/prepare.py --id '${{ matrix.id }}' --work "$RUNNER_TEMP/e610" --output "$PWD/output/${{ matrix.id }}"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ matrix.id }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
  offline-tools:
    if: ${{ inputs.tools_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: centos-7, image: 'quay.io/centos/centos:7' }
          - { id: centos-8, image: 'quay.io/centos/centos:8' }
          - { id: centos-9, image: 'quay.io/centos/centos:stream9' }
          - { id: centos-10, image: 'quay.io/centos/centos:stream10' }
          - { id: debian-11, image: 'debian:11' }
          - { id: debian-12, image: 'debian:12' }
          - { id: debian-13, image: 'debian:13' }
          - { id: ubuntu-24.10, image: 'ubuntu:24.10' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare disposable test image without build tools
        if: inputs.targets == '' || contains(format(',{0},', inputs.targets), format(',{0},', matrix.id))
        run: |
          docker build --build-arg IMAGE='${{ matrix.image }}' -f coverage/test.Dockerfile -t e610-test-${{ matrix.id }} .
          docker save e610-test-${{ matrix.id }} | gzip -1 > test-image.tar.gz
          sha256sum test-image.tar.gz > test-image.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.targets == '' || contains(format(',{0},', inputs.targets), format(',{0},', matrix.id))
        with:
          name: tools-${{ matrix.id }}
          path: |
            test-image.tar.gz
            test-image.sha256
          retention-days: 7
