name: E610 unified r3 release media validation
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft candidate release containing the exact r3 media'
        required: true
        default: v6.4.5-multios-r3
      iso_sha256:
        description: 'Expected candidate ISO SHA-256'
        required: true
      archive_sha256:
        description: 'Expected candidate tar.gz SHA-256'
        required: true
permissions:
  # GitHub restricts access to unpublished draft release assets to writers.
  contents: write
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {id: ubuntu-20.04.6, series: coverage}
          - {id: debian-11.11.0, series: coverage}
          - {id: almalinux-8.10, series: coverage}
          - {id: almalinux-9.0, series: coverage}
          - {id: almalinux-9.8, series: coverage}
          - {id: almalinux-10.0, series: coverage}
          - {id: rocky-10.0, series: coverage}
          - {id: rocky-10.2, series: coverage}
          - {id: ubuntu-22.04.3, series: expanded}
          - {id: ubuntu-24.04, series: expanded}
          - {id: rocky-8.10, series: expanded}
          - {id: centos-7.9, series: centos}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and verify the immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ISO_SHA: ${{ inputs.iso_sha256 }}
          ARCHIVE_SHA: ${{ inputs.archive_sha256 }}
        run: |
          mkdir candidate output
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate
          (cd candidate && sha256sum --status -c SHA256SUMS)
          printf '%s  candidate/E610-MultiOS-6.4.5-r3.iso\n' "$ISO_SHA" | sha256sum -c -
          printf '%s  candidate/E610-MultiOS-6.4.5-r3.tar.gz\n' "$ARCHIVE_SHA" | sha256sum -c -
          bash expanded/setup-runner.sh
      - name: Extract exact original kernel fixtures
        if: matrix.series != 'centos'
        run: |
          if [ '${{ matrix.series }}' = coverage ]; then
            python3 coverage/prepare.py --id '${{ matrix.id }}' --work "$RUNNER_TEMP/fixtures" --output "$RUNNER_TEMP/fixture-metadata" --fixtures-only
          else
            python3 expanded/prepare.py expanded/inventory.json '${{ matrix.id }}' "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/fixture-metadata" --fixtures-only
          fi
      - name: Mount real driver data ISO read-only
        run: |
          mkdir "$RUNNER_TEMP/media"
          sudo mount -o loop,ro candidate/E610-MultiOS-6.4.5-r3.iso "$RUNNER_TEMP/media"
          test "$(findmnt -n -o FSTYPE --target "$RUNNER_TEMP/media")" = iso9660
          test "$(blkid -p -s LABEL -o value candidate/E610-MultiOS-6.4.5-r3.iso)" = E610_MULTIOS
      - name: Verify all entry points and preserved historical backups offline
        env:
          MEDIA_ID: ${{ matrix.id }}
          SERIES: ${{ matrix.series }}
        run: python3 coverage/test-candidate.py
      - name: Detach ISO
        if: always()
        run: if mountpoint -q "$RUNNER_TEMP/media"; then sudo umount "$RUNNER_TEMP/media"; fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: media-${{ matrix.id }}
          path: output/
          retention-days: 30
